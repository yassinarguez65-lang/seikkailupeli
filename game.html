<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="adventuregame.css">
    <script src="adventuregame.js" type="module"></script>
    <title>A Little Adventure - the Game</title>
</head>
<body>
    <div id="game">
        <canvas id="map" width="400" height="400">Please enable canvas to play the game.</canvas>
        <div id="sidebar">
            <canvas id="narrative" width="200" height="250"></canvas>
            <canvas id="inventory" width="200" height="50"></canvas>
            <div id="controls">
                <button id="ok">OK</button>
                <button id="up-arrow">&#8593;</button>
                <button id="cancel">Cancel</button>
                <button id="left-arrow">&#8592;</button>
                <button id="down-arrow">&#8595;</button>
                <button id="right-arrow">&#8594;</button>
            </div>
        </div>
    </div>
</body>
</html>
